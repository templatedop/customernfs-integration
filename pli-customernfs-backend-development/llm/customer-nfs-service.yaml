openapi: 3.0.3

info:
  title: Customer NFS Service API
  version: 1.0.0
  description: |
    # Customer NFS (Non-Financial Service) — Postal Life Insurance API

    **Module**: Customer NFS Service  
    **Version**: 1.0.0  
    **Date**: March 2026  
    **Status**: Draft  
    **Technology Stack**: Golang, Temporal.io, PostgreSQL, Kafka, React

    ## Overview

    The Customer NFS Service is a dedicated microservice responsible for orchestrating
    non-financial service requests that modify **customer master data** for Postal Life
    Insurance (PLI) and Rural Postal Life Insurance (RPLI). It owns the workflow lifecycle
    (request creation, document collection, approval routing, execution) and delegates
    actual data mutation to Customer Core Service and Customer Profile Service via Temporal workflows.

    **In Scope**: Address Change (Aadhaar + Manual), Name Change (Aadhaar + Manual),
    Service Request Lifecycle, Missing Document Collection, Request Withdrawal, Audit Trail.

    **Out of Scope**: Agent Change, Nominee Change, Duplicate Policy Bond, Refund of Premium.

    ---

    ## API Inventory Summary

    | Category | Count | API IDs |
    |----------|-------|---------|
    | **Address Change (Core Journey)** | 4 | CORE-001 to CORE-004 |
    | **Name Change (Core Journey)** | 4 | CORE-005 to CORE-008 |
    | **Service Request Management** | 2 | CORE-009, CORE-010 |
    | **Lookup / Reference** | 8 | LU-001 to LU-008 |
    | **Validation** | 3 | VA-001 to VA-003 |
    | **Status & Tracking** | 5 | ST-001 to ST-005 |
    | **Document Management** | 5 | DM-001 to DM-005 |
    | **CPC Operations** | 6 | CPC-001 to CPC-006 |
    | **Total Unique APIs** | **37** | |

    ---

    ## Authentication & Channels

    - **Customer-facing APIs** — Bearer JWT (issued by PLI Identity Service)
    - **CPC Staff APIs** — Bearer JWT with CPC role claims
    - **Internal/System** — API Key header `X-Internal-Api-Key`

    **Supported Channels**: Portal, Mobile, PostOffice, CallCenter, AgentPortal

    ---

    ## Temporal Workflows

    | Workflow | ID | Duration | Task Queue |
    |----------|----|----------|------------|
    | Address Change — Aadhaar | WF-NFS-001 | < 15 seconds | customer-nfs-tq |
    | Address Change — Manual | WF-NFS-002 | 15–30 days | customer-nfs-tq |
    | Name Change — Aadhaar | WF-NFS-003 | < 15 seconds | customer-nfs-tq |
    | Name Change — Manual | WF-NFS-004 | 15–30 days | customer-nfs-tq |
    | NFS Request Withdrawal | WF-NFS-005 | < 5 days | customer-nfs-tq |

    ---

    ## Key Business Rules Referenced

    - **BR-NFS-001**: Aadhaar-based address change completes immediately (< 15 s)
    - **BR-NFS-002**: Manual address change requires CPC approval (15–30 business days)
    - **BR-NFS-007**: Aadhaar-based name change completes immediately (< 15 s)
    - **BR-NFS-008**: Manual name change requires legal documents + CPC approval
    - **BR-NFS-011**: Ticket format `NFS-{TYPE}-{YYYYMMDD}-{SEQ6}`
    - **BR-NFS-012**: 8 statuses, 17 valid transitions
    - **BR-NFS-013**: Withdrawal allowed for CREATED / PENDING_DOCUMENTS / PENDING_APPROVAL
    - **BR-NFS-014**: Secure upload link max 3 attempts, 7-day expiry each
    - **BR-NFS-015**: Aadhaar auto-approval restricted to Portal and Mobile channels only
    - **BR-NFS-016**: Audit log is INSERT-only, 10-year retention

    ---

    ## Events Published

    | Event | Trigger |
    |-------|---------|
    | `nfr.request.created` | Service request created |
    | `nfr.request.completed` | Request reaches COMPLETED |
    | `nfr.request.rejected` | CPC rejects request |
    | `nfr.request.withdrawn` | Customer withdraws request |
    | `nfr.missing_doc.requested` | CPC requests missing documents |
    | `nfr.sla.breached` | SLA deadline exceeded |
    | `customer.address.updated` | Address change completed |
    | `customer.name.updated` | Name change completed |

